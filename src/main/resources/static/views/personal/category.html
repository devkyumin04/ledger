<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../../css/common.css">
    <script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="personal-main.html" class="inline-link">← 개인 가계부</a>
        <h1>카테고리 관리</h1>

        <nav class="sub-nav">
            <a href="personal-main.html">가계부</a>
            <a href="category.html" class="active">카테고리</a>
        </nav>

        <div class="tabs">
            <button class="tab active" data-type="E">지출</button>
            <button class="tab" data-type="I">수입</button>
        </div>

        <button id="addBtn">+ 추가</button>

        <ul id="categoryList"></ul>

        <p id="resultMessage" class="result-message"></p>
    </div>

    <!-- 모달 -->
    <div id="categoryModal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 id="modalTitle">카테고리 추가</h2>
            <form id="categoryForm" class="form-container">
                <input type="hidden" id="editingId">
                <label>이름 <input type="text" id="categoryName" maxlength="20" required></label>
                <label>이모지 <input type="text" id="categoryEmoji" maxlength="10"></label>
                <label>상위 카테고리
                    <select id="parentCategoryNum">
                        <option value="">없음 (대분류)</option>
                    </select>
                </label>
                <button type="submit" id="submitBtn">저장</button>
                <button type="button" id="cancelBtn">취소</button>
            </form>
        </div>
    </div>

    <script src="../../js/util/authGuard.js"></script>
    <script src="../../js/util/apiClient.js"></script>
    <script src="../../js/util/buttonUtil.js"></script>
    <script src="../../js/personal/category.js"></script>
</body>
</html>
