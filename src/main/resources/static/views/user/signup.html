<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
	<link rel="stylesheet" href="../../css/common.css">
	<script src="/js/util/theme.js"></script>
</head>
<body>
    <h1>회원가입</h1>

    <form id="signupForm" class="form-container">
        <label for="email">이메일</label>
        <input type="email" id="email" required>
        <span id="emailError" class="error-message"></span>

        <label for="password">비밀번호</label>
        <input type="password" id="password" required>
        <span id="passwordError" class="error-message"></span>

        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" required>
        <span id="nicknameError" class="error-message"></span>

        <button type="submit" id="submitBtn">가입하기</button>
    </form>

    <p>이미 계정이 있으신가요? <a href="../user/login.html" class="inline-link">로그인</a></p>

    <div id="resultMessage" class="result-message"></div>

    <script src="../../js/util/apiClient.js"></script>
    <script src="../../js/util/buttonUtil.js"></script>
    <script src="../../js/user/signup.js"></script>
</body>
</html>
