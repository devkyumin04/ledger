<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원 탈퇴 — 도토리</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/util/theme.js"></script>
</head>
<body>
    <div class="page-container">
        <a href="/views/user/mypage.html" class="inline-link">← 마이페이지</a>
        <h1>회원 탈퇴</h1>
    </div>

    <section class="form-section">
        <form id="withdrawForm" class="form-container">
            <p class="form-help">탈퇴하면 바로 로그아웃되고 계정이 비활성화됩니다.
               <strong>30일 뒤</strong> 계정과 가계부 기록이 모두 완전히 삭제되며 되돌릴 수 없습니다.
               30일 안에 다시 로그인하면 탈퇴가 취소됩니다.</p>

            <label for="password">비밀번호 확인</label>
            <input type="password" id="password" maxlength="20" required>

            <button type="submit" id="submitBtn">탈퇴하기</button>
        </form>
        <div id="resultMessage" class="result-message"></div>
    </section>

    <footer class="site-footer">
        <a href="/views/privacy.html" class="inline-link">개인정보 처리방침</a>
        <a href="mailto:support@dotoree.app" class="inline-link">support@dotoree.app</a>
    </footer>

    <script src="/js/util/authGuard.js"></script>
    <script src="/js/util/apiClient.js"></script>
    <script src="/js/util/buttonUtil.js"></script>
    <script src="/js/user/withdraw.js"></script>
</body>
</html>
