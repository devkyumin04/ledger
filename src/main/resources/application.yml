spring:
  application:
    name: ledger

  datasource:
    url: jdbc:mysql://localhost:3306/ledger_db #local, github actions, ec2 전부 각 컴퓨터 자신의 MySQL을 가리키므로 환경변수 처리 제외
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: native #Nginx 가 붙인 X-Forwarded-Proto/For 를 믿는다(127.0.0.1·사설 IP 에서 온 것만). 프록시 없는 로컬·CI 에선 헤더가 안 와서 효과 없음

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
