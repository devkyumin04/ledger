name: CI

on:
  push:
    branches: [ main ]
    # 문서만 바꾼 push 로 운영 서버를 재시작하지 않는다 (배포 = 약 10초 중단)
    paths-ignore: [ 'docs/**', '**.md' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: ledger_db
          MYSQL_USER: ledger_app
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드 및 테스트
        env:
          DB_USERNAME: ledger_app
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci_test_secret_key_for_github_actions_1234567890
        run: ./gradlew build

      - name: 실행 jar 를 artifact 로 올리기
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger-jar
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # OIDC 토큰 발급에 id-token: write 가 필요하다. 나머지는 읽기만
    permissions:
      id-token: write
      contents: read

    # 배포가 겹치면 보안 그룹 규칙을 서로 지운다. 한 번에 하나씩, 취소하지 않고 대기
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    env:
      AWS_REGION: ap-northeast-2
      EC2_USER: deploy

    steps:
      - name: build 잡이 만든 jar 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ledger-jar
          path: dist

      # ⚠️ 임시 디버그 — 3-6 원인 확인용. 확인 끝나면 이 스텝 통째로 삭제할 것
      - name: (임시) OIDC 클레임 · 역할 ARN 길이 확인
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          # 토큰 자체는 찍지 않는다. 가운데 payload 만 디코드해 필요한 클레임만 출력
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ('sub', 'aud', 'repository', 'repository_owner', 'ref', 'iss'):
              print(f'{k:18}= {c.get(k)}')
          PY
          ARN='${{ secrets.AWS_ROLE_ARN }}'
          echo "ARN 길이          = ${#ARN}   (정상 51)"
          echo "ARN 접두/접미      = ${ARN:0:12}...${ARN: -8}"

      - name: AWS 임시 자격 받기 (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 러너 공인 IP 확인
        id: runner_ip
        run: |
          IP=$(curl -s --max-time 10 https://checkip.amazonaws.com || curl -s --max-time 10 https://api.ipify.org)
          IP=$(echo "$IP" | tr -d '[:space:]')
          [ -n "$IP" ] || { echo "러너의 공인 IP를 알아내지 못했습니다"; exit 1; }
          echo "::add-mask::$IP"
          echo "cidr=${IP}/32" >> "$GITHUB_OUTPUT"

      - name: 22번을 러너 IP 에만 열기
        run: |
          # 이전 실행이 강제 종료돼 규칙이 남아 있을 수 있다. 먼저 지우고 연다(자기 정리)
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SG_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.cidr }}" 2>/dev/null || true
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SG_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.cidr }}"

      - name: 배포 키 파일 만들기
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ledger_deploy
          chmod 600 ~/.ssh/ledger_deploy

      - name: jar 전송 → 교체 → 재시작
        run: |
          SSH="ssh -i ~/.ssh/ledger_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          scp -i ~/.ssh/ledger_deploy -o StrictHostKeyChecking=accept-new \
            dist/*-SNAPSHOT.jar "${EC2_USER}@${{ secrets.EC2_HOST }}:/opt/ledger/ledger.jar.new"
          # sudoers 는 문자열 그대로 매칭이라 `sudo systemctl restart ledger` 를 정확히 이 형태로
          $SSH "${EC2_USER}@${{ secrets.EC2_HOST }}" \
            'set -e
             # 롤백용 — 덮어쓰기 전에 지금 돌고 있는 jar 를 남긴다 (복구: cp ledger.jar.prev ledger.jar 후 restart)
             if [ -f /opt/ledger/ledger.jar ]; then cp -p /opt/ledger/ledger.jar /opt/ledger/ledger.jar.prev; fi
             mv /opt/ledger/ledger.jar.new /opt/ledger/ledger.jar
             sudo systemctl restart ledger'

      - name: 헬스 200 대기 (최대 90초)
        run: |
          # Type=simple 이라 systemctl 의 active 는 "프로세스가 떴다" 까지다(3-3 실측).
          # 8080 은 밖에 열려 있지 않으므로 서버 안에서 localhost 로 확인한다
          ssh -i ~/.ssh/ledger_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "${EC2_USER}@${{ secrets.EC2_HOST }}" \
            'for i in $(seq 1 30); do
               code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/actuator/health || true)
               if [ "$code" = "200" ]; then echo "healthy after ${i} tries"; exit 0; fi
               sleep 3
             done
             echo "헬스 체크 실패 — 마지막 응답: ${code}"
             journalctl -u ledger -n 50 --no-pager
             exit 1'

      - name: 22번 닫기
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SG_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.cidr }}" 2>/dev/null || true
